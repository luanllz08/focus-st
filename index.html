<!DOCTYPE html>  <html lang="pt-br">  
<head>  
<meta charset="UTF-8">  
<title>Painel</title>  

<style>

#popup{
display:none;
position:fixed;
top:50%;
left:60%;
transform:translate(-50%,-50%);
background:#1a1a1a;
padding:20px;
width:350px;
border-radius:10px;
box-shadow:0px 0px 20px black;
}

#popup input,
#popup select{
width:100%;
padding:10px;
margin-top:10px;
background:#0d0d0d;
border:none;
color:white;
box-sizing:border-box;
}

#popup button{
margin-top:15px;
padding:10px;
border:none;
background:red;
color:white;
cursor:pointer;
}

* {  
    margin: 0;  
    padding: 0;  
    box-sizing: border-box;  
    font-family: Arial, sans-serif;  
}  
  
body {  
    background: radial-gradient(circle at bottom right, #ff0000 0%, #1a0000 40%, #000 80%);  
    color: #fff;  
}  
  
.container {  
    display: flex;  
    height: 100vh;  
}  
  
.sidebar {  
    width: 230px;  
    background: #252525;  
    padding: 20px;  
}  
  
.profile {  
    display: flex;  
    align-items: center;  
    gap: 10px;  
    margin-bottom: 30px;  
}  
  
.profile img {  
    width: 50px;  
    border-radius: 50%;  
}  
  
.menu {  
    list-style: none;  
}  
  
.menu li {  
    margin: 8px 0;  
    background: #1a1a1a;  
    border-radius: 8px;  
    transition: 0.3s;  
}  
  
.menu li:hover {  
    transform: scale(1.05);  
    background: #ca1a1a;  
}  
  
.menu li a {  
    display: block;  
    padding: 12px;  
    color: #fff;  
    text-decoration: none;  
}  
  
.icon {  
    filter: grayscale(100%);  
    margin-right: 8px;  
}  
  
  
.menu li:hover {  
    background: #ff0000;  
}  
  
.menu li.active {  
    background: #ff0000;  
}  
  
.menu li.active a {  
    font-weight: bold;  
}  
  
.main {  
    flex: 1;  
    padding: 20px;  
}  
  
.banner {  
    position: relative;  
    display: flex;  
    justify-content: space-between;  
    background: url('https://images.unsplash.com/photo-1549887534-1541e9326642') center/cover;  
    border-radius: 12px;  
    padding: 20px;  
    margin-bottom: 20px;  
    overflow: hidden;  
}  
  
.banner::before {  
    content: "";  
    position: absolute;  
    inset: 0;  
    background: rgba(43, 42, 42, 0.6);  
}  
  
.banner-content {  
    position: relative;  
    z-index: 1;  
}  
  
.banner img {  
    height: 100px;  
    border-radius: 10px;  
    position: relative;  
    z-index: 1;  
}  
  
.invite {  
    background: linear-gradient(90deg, #cc0000, #ff0000);  
    padding: 15px;  
    border-radius: 12px;  
    margin-bottom: 20px;  
    display: flex;  
    justify-content: space-between;  
    align-items: center;  
}  
  
.invite button {  
    padding: 10px 18px;  
    border: none;  
    border-radius: 8px;  
    background: #fff;  
    color: #000;  
    cursor: pointer;  
    font-weight: bold;  
}  
  
.invite button:hover {  
    transform: scale(1.05);  
    background: #ffffff;  
}  
  
.cards {  
    display: flex;  
    gap: 15px;  
    margin-bottom: 20px;  
}  
  
.card {  
    flex: 1;  
    background: #1a1a1a;  
    padding: 15px;  
    border-radius: 10px;  
    text-align: center;  
    transition: 0.3s;  
}  
  
.card:hover {  
    transform: scale(1.05);  
    background: #ca1a1a;  
}  
  
.card a {  
    text-decoration: none;  
    color: #fff;  
    display: block;  
}  
  
.card img {  
    width: 40px;  
    margin-bottom: 10px;  
}  
  
.agenda {  
    background: #1a1a1a;  
    padding: 15px;  
    border-radius: 10px;  
}  
  
.item {  
    background: #0d0d0d;  
    padding: 10px;  
    margin-top: 10px;  
    border-radius: 8px;  
    display: flex;  
    justify-content: space-between;  
}  
  
.actions button {  
    border: none;  
    padding: 6px 10px;  
    margin-left: 5px;  
    border-radius: 6px;  
    cursor: pointer;  
}  
  
.actions button:hover {  
    transform: scale(1.05);  
    background: #ca1a1a;  
}  
  
.edit {  
    background: #333;  
    color: #fff;  
}  
  
.delete {  
    background: #ff0000;  
    color: #fff;  
}  
</style>
</head>
