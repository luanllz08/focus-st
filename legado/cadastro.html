<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --background: #0f0a0a;
            --card-bg: rgba(28, 18, 18, 0.7);
            --text-main: #fcf8f8;
            --text-muted: #9e8e8e;
            --border: rgba(255, 255, 255, 0.06);
            --input-bg: rgba(15, 10, 10, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(
                circle at top right,
                #450a0a 0%,
                var(--background) 100%
            );

            color: var(--text-main);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: var(--primary);
            filter: blur(140px);
            opacity: 0.12;
            z-index: 0;
        }

        body::before {
            top: 10%;
            left: 15%;
        }

        body::after {
            bottom: 10%;
            right: 15%;
        }

        .container {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 440px;

            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid var(--border);
            border-radius: 24px;

            padding: 40px;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);

            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        /* SUA LOGO */
        .logo-area {
            width: 150px;
            height: 100px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto 12px;

            background: transparent;
            border: none;
            box-shadow: none;
        }

        .logo-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 44px;

            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;

            color: white;
            font-size: 15px;

            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(239, 68, 68, 0.2);

            background: rgba(20, 12, 12, 0.8);
        }

        .form-group:focus-within label {
            color: var(--primary);
        }

        .form-group:focus-within i.input-icon {
            color: var(--primary);
        }

        .toggle-password {
            position: absolute;
            right: 14px;

            background: none;
            border: none;

            color: var(--text-muted);
            cursor: pointer;

            display: flex;
            align-items: center;

            padding: 0;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;

            margin-bottom: 24px;

            font-size: 13px;
            color: var(--text-muted);

            cursor: pointer;
            line-height: 1.4;
        }

        .terms input {
            accent-color: var(--primary);
            cursor: pointer;
            margin-top: 2px;
        }

        .terms a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;

            background: linear-gradient(
                135deg,
                var(--primary),
                #dc2626
            );

            border: none;
            border-radius: 12px;

            color: white;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
            transition: all 0.2s ease;

            box-shadow:
                0 4px 14px rgba(239, 68, 68, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-1px);

            box-shadow:
                0 6px 22px rgba(239, 68, 68, 0.45);

            background: linear-gradient(
                135deg,
                var(--primary-hover),
                #991b1b
            );
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .footer-text {
            text-align: center;
            margin-top: 28px;

            font-size: 14px;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 24px;
            }

            .logo-area {
                width: 130px;
                height: 85px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <!-- SUA LOGO -->
            <div class="logo-area">
                <img src="logoff.png" alt="Logo">
            </div>

            <p>Crie sua conta para começar</p>

        </div>

        <form
            id="registerForm"
            onsubmit="event.preventDefault(); validateForm();"
        >

            <!-- Nome -->
            <div class="form-group">

                <label for="name">
                    Nome completo
                </label>

                <div class="input-wrapper">

                    <i
                        data-lucide="user"
                        class="input-icon"
                        size="18"
                    ></i>

                    <input
                        type="text"
                        id="name"
                        placeholder="Seu nome completo"
                        required
                        autocomplete="name"
                    >

                </div>
            </div>


            <!-- E-mail -->
            <div class="form-group">

                <label for="email">
                    E-mail de acesso
                </label>

                <div class="input-wrapper">

                    <i
                        data-lucide="mail"
                        class="input-icon"
                        size="18"
                    ></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu-email@empresa.com"
                        required
                        autocomplete="email"
                    >

                </div>
            </div>


            <!-- Senha -->
            <div class="form-group">

                <label for="password">
                    Criar Senha
                </label>

                <div class="input-wrapper">

                    <i
                        data-lucide="key-round"
                        class="input-icon"
                        size="18"
                    ></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Mínimo 8 caracteres"
                        required
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="toggleField('password', 'eyeIcon1')"
                        aria-label="Mostrar ou ocultar senha"
                    >
                        <i
                            data-lucide="eye"
                            id="eyeIcon1"
                            size="18"
                        ></i>
                    </button>

                </div>
            </div>


            <!-- Confirmar senha -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirmar Senha
                </label>

                <div class="input-wrapper">

                    <i
                        data-lucide="shield-check"
                        class="input-icon"
                        size="18"
                    ></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repita a senha criada"
                        required
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="toggleField('confirmPassword', 'eyeIcon2')"
                        aria-label="Mostrar ou ocultar senha"
                    >
                        <i
                            data-lucide="eye"
                            id="eyeIcon2"
                            size="18"
                        ></i>
                    </button>

                </div>
            </div>


            <!-- Termos -->
            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    Li e concordo com os
                    <a href="#">Termos de Uso</a>
                    e a
                    <a href="#">Política de Privacidade</a>.
                </span>

            </label>


            <!-- Botão -->
            <button
                type="submit"
                class="btn-submit"
            >
                Criar Minha Conta
            </button>

        </form>


        <!-- Login -->
        <p class="footer-text">
            Já possui uma conta?
            <a href="login.html">
                Fazer login
            </a>
        </p>

    </div>


    <script>

        // Inicializa os ícones
        lucide.createIcons();


        // Mostrar / ocultar senha
        function toggleField(inputId, iconId) {

            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === "password") {

                input.type = "text";

                icon.setAttribute(
                    "data-lucide",
                    "eye-off"
                );

            } else {

                input.type = "password";

                icon.setAttribute(
                    "data-lucide",
                    "eye"
                );
            }

            lucide.createIcons();
        }


        // Validação do formulário
        function validateForm() {

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const terms =
                document.getElementById("terms").checked;


            if (name.length < 3) {
                alert("Digite seu nome completo.");
                return;
            }


            if (password.length < 8) {
                alert("A senha deve ter no mínimo 8 caracteres.");
                return;
            }


            if (password !== confirmPassword) {
                alert("As senhas não são iguais.");
                return;
            }


            if (!terms) {
                alert("Você precisa aceitar os termos.");
                return;
            }


            alert(
                "Conta criada com sucesso!"
            );

            document.getElementById("registerForm").reset();
        }

    </script>

</body>
</html>
