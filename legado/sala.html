<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
}

.container{
    display:flex;
    min-height:100vh;
    padding:20px;
    gap:20px;
}

.painel{
    width:40%;
    background:#161616;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
    color:#ff0000;
    margin-bottom:25px;
    text-shadow:0 0 15px rgba(255, 0, 0, 0.6);
}

.card{
    background:#222;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.card b{
    font-size:18px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#111;
    color:white;
    outline:none;
    font-size:15px;
    transition:.3s;
}

input:focus{
    box-shadow:0 0 10px #ff0000;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#ff0000;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover {  
    transform: scale(1.05);  
    background: #ca1a1a;  
} 

.online{
    background:#111;
    border:1px solid #333;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
}

.online button{
    width:auto;
    float:right;
    padding:8px 15px;
    margin-top:-4px;
}

.imagem{
    flex:1;
}

.imagem img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

.status{
    color:#00ff00;
    font-size:20px;
}

</style>
</head>
<body>

<div class="container">

    <div class="painel">

        <h1>🏫 SALA</h1>

        <div class="card">
            <b>Entrar em uma sala</b>

            <input type="text" placeholder="ID da sala">

            <input type="password" placeholder="Senha">

            <button>Entrar</button>
        </div>

        <div class="card">
            <b>Criar uma sala</b>

            <input type="text" placeholder="Nome da sala">

            <input type="password" placeholder="Senha">

            <button>Criar</button>
        </div>

        <div class="card">
            <b>SALAS ONLINE</b>


            <div class="online">
                <span class="status">●</span>
                <b> Sala de Thiago</b>

                <button>Entrar</button>

                <div style="clear:both;"></div>
            </div>

            <div class="online">
                <span class="status">●</span>
                <b> Sala de Armando</b>

                <button>Entrar</button>

                <div style="clear:both;"></div>
            </div>

            <div class="online">
                <span class="status">●</span>
                <b> Sala de Julio</b>

                <button>Entrar</button>

                <div style="clear:both;"></div>
            </div>

        </div>

    </div>

    <div class="imagem">
        <img src="sala1.jpeg" alt="Sala">
    </div>

</div>

</body>
</html>
