<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus STT — Formulário de Atendimento</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <main class="form-card">
        <header class="form-header">
            <h1>Abertura de Atendimento</h1>
            <p class="subtitle">Preencha os dados abaixo para registrar sua demanda.</p>
        </header>

        <form id="formAtendimento" novalidate>
            <div class="form-group">
                <label for="nome_completo">Nome completo <span class="required">*</span></label>
                <input
                    type="text"
                    id="nome_completo"
                    name="nome_completo"
                    minlength="3"
                    maxlength="150"
                    placeholder="Digite seu nome completo"
                    required
                    aria-describedby="nome_completo_erro"
                >
                <p class="erro" id="nome_completo_erro" aria-live="polite"></p>
            </div>

            <div class="form-group">
                <label for="email">E-mail <span class="required">*</span></label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu-email@dominio.com"
                    required
                    aria-describedby="email_erro"
                >
                <p class="erro" id="email_erro" aria-live="polite"></p>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone <span class="required">*</span></label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                    aria-describedby="telefone_erro"
                >
                <p class="erro" id="telefone_erro" aria-live="polite"></p>
            </div>

            <div class="form-group">
                <label for="tipo_atendimento">Tipo de atendimento <span class="required">*</span></label>
                <select id="tipo_atendimento" name="tipo_atendimento" required aria-describedby="tipo_atendimento_erro">
                    <option value="">Selecione...</option>
                    <option value="Duvida">Dúvida</option>
                    <option value="Sugestao">Sugestão</option>
                    <option value="Reclamacao">Reclamação</option>
                    <option value="Solicitacao">Solicitação</option>
                    <option value="Elogio">Elogio</option>
                </select>
                <p class="erro" id="tipo_atendimento_erro" aria-live="polite"></p>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição <span class="required">*</span></label>
                <textarea
                    id="descricao"
                    name="descricao"
                    rows="5"
                    minlength="10"
                    maxlength="2000"
                    placeholder="Descreva sua demanda em detalhes"
                    required
                    aria-describedby="descricao_erro"
                ></textarea>
                <p class="erro" id="descricao_erro" aria-live="polite"></p>
            </div>

            <button type="submit" id="btnEnviar" class="btn-primario">Enviar Atendimento</button>
        </form>

        <footer class="form-footer">
            <p>É um administrador? <a href="admin/login.html">Acesse o painel</a></p>
        </footer>
    </main>

    <script src="js/api.js"></script>
    <script src="js/sanitizacao.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/validacao.js"></script>
    <script src="js/formulario.js"></script>
</body>

</html>
