<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus STT — Painel Administrativo</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <h1>Focus STT — Painel Administrativo</h1>
    <div>
      <span class="usuario-info" id="usuarioInfo"></span>
      <button class="btn-logout" id="btnLogout">Sair</button>
    </div>
  </header>

  <main class="container">
    <div class="filtros">
      <select id="filterStatus">
        <option value="">Todos os Status</option>
        <option value="Pendente">Pendente</option>
        <option value="Em Andamento">Em Andamento</option>
        <option value="Concluido">Concluído</option>
        <option value="Cancelado">Cancelado</option>
      </select>
      <select id="filterTipo">
        <option value="">Todos os Tipos</option>
        <option value="Duvida">Dúvida</option>
        <option value="Sugestao">Sugestão</option>
        <option value="Reclamacao">Reclamação</option>
        <option value="Solicitacao">Solicitação</option>
        <option value="Elogio">Elogio</option>
      </select>
    </div>

    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Status</th>
            <th>Criado em</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaAtendimentos"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">
        Nenhum atendimento encontrado.
      </div>
    </div>

    <div class="paginacao" id="paginacao"></div>
  </main>

  <div class="modal-overlay oculto" id="modalExclusao1">
    <div class="modal">
      <h2>Confirmar exclusão</h2>
      <p id="modal1Mensagem">Tem certeza que deseja excluir este atendimento? Esta ação não pode ser desfeita.</p>
      <div class="modal-acoes">
        <button class="btn cancelar" id="modal1Cancelar">Cancelar</button>
        <button class="btn confirmar-perigo" id="modal1Confirmar">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay oculto" id="modalExclusao2">
    <div class="modal">
      <h2>Confirmação final</h2>
      <p>Digite o número do atendimento <strong id="modal2Id">#0</strong> para confirmar a exclusão permanente:</p>
      <input type="number" id="modal2Input" placeholder="Digite o ID">
      <p class="aviso" id="modal2Aviso"></p>
      <div class="modal-acoes">
        <button class="btn cancelar" id="modal2Cancelar">Cancelar</button>
        <button class="btn confirmar-perigo" id="modal2Confirmar" disabled>Excluir Permanentemente</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/status.js"></script>
  <script src="../js/exclusao.js"></script>
</body>
</html>
